[package]
name = "at-mail-desktop"
version = "1.0.13"
description = "@mail — launcher unificado de e-mail e Google Chat"
authors = ["@mail"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "at_mail_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
