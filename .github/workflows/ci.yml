name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Checagem de tipos (core + ui)
        run: npm run typecheck

      - name: Testes do núcleo
        run: npm test
