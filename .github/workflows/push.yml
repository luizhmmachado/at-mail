name: Notificações push mobile

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Sincronizar notificações
        env:
          CRON_SECRET: ${{ secrets.PUSH_CRON_SECRET }}
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://at-mail.vercel.app/api/push/cron
