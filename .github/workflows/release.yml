name: Release multiplataforma

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Gerar projeto Android
        working-directory: apps/app
        run: npx expo prebuild --platform android --no-install --non-interactive
      - name: Compilar APK release
        working-directory: apps/app/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: mail-android-apk
          path: apps/app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  desktop:
    name: Desktop ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: mail-linux
          - os: windows-latest
            artifact: mail-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Dependências Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Exportar frontend web
        run: npm --workspace apps/app run export:web
      - name: Compilar Tauri
        working-directory: apps/desktop
        run: npm run build
      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**
            apps/desktop/src-tauri/target/release/@mail*
          if-no-files-found: error

  release:
    name: Criar GitHub Release
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Empacotar artefatos
        run: |
          mkdir -p upload
          find release-artifacts -type f \( -name '*.apk' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.msi' -o -name '*.exe' \) -exec cp {} upload/ \;
          test -n "$(find upload -type f -print -quit)"
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: upload/*
